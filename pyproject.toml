[project]
name = "fluke"
version = "0.1.0"
description = "Was your eval improvement real, or a fluke? Free Lift Under K Evaluations -- the points a search scores on noise alone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["eval", "evaluation", "prompt-optimization", "winners-curse",
            "selection-bias", "overfitting", "llm-eval", "benchmark",
            "statistics", "rag", "agent-eval", "hyperparameter-tuning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.0", "transformers>=4.40"]
examples = ["torch>=2.0", "transformers>=4.40", "datasets>=2.0"]

[project.scripts]
fluke = "fluke.cli:main"

[project.urls]
Source = "https://github.com/novaleolin/fluke"
Issues = "https://github.com/novaleolin/fluke/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluke*"]
