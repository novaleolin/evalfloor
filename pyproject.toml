[project]
name = "overtuned"
version = "0.1.0"
description = "Search over the question, not the model: optimise System One decision schemas, and report how much of the gain was real."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["system-one", "jev", "typed-decisions", "schema-optimization",
            "prompt-optimization", "winners-curse", "classifier", "routing", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.0", "transformers>=4.40"]
examples = ["torch>=2.0", "transformers>=4.40", "datasets>=2.0"]

[project.scripts]
overtuned = "overtuned.cli:main"

[project.urls]
Source = "https://github.com/novaleolin/overtuned"
Issues = "https://github.com/novaleolin/overtuned/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overtuned*"]
