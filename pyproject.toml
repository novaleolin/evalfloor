[project]
name = "evalfloor"
version = "0.3.0"
description = "EvalFloor: is your LLM eval improvement real? Trying k prompt variants and keeping the best scores points on noise alone -- this computes how many, so you can tell a real gain from a lucky sample."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["llm-eval", "llm-evaluation", "eval", "evaluation", "benchmark",
            "prompt-engineering", "prompt-optimization", "prompt-tuning",
            "selection-bias", "winners-curse", "overfitting", "significance",
            "statistics", "ab-testing", "rag", "rag-evaluation",
            "agent-evaluation", "hyperparameter-tuning", "model-selection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  # shields.io reads the pyversions badge from these, not from
  # requires-python, and renders "missing" without them.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.0", "transformers>=4.40"]
examples = ["torch>=2.0", "transformers>=4.40", "datasets>=2.0"]

[project.scripts]
evalfloor = "evalfloor.cli:main"
evalfloor-gate = "evalfloor.gate:main"

[project.urls]
Source = "https://github.com/novaleolin/evalfloor"
Issues = "https://github.com/novaleolin/evalfloor/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalfloor*"]

[tool.setuptools.package-data]
evalfloor = ["py.typed"]
