[project]
name = "evalfloor"
version = "0.1.0"
description = "How many points does your eval improvement get for free? Tuning over k variants scores points on noise alone -- this tells you how many."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["eval", "evaluation", "prompt-optimization", "winners-curse",
            "selection-bias", "overfitting", "llm-eval", "benchmark",
            "statistics", "rag", "agent-eval", "hyperparameter-tuning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.0", "transformers>=4.40"]
examples = ["torch>=2.0", "transformers>=4.40", "datasets>=2.0"]

[project.scripts]
evalfloor = "evalfloor.cli:main"

[project.urls]
Source = "https://github.com/novaleolin/evalfloor"
Issues = "https://github.com/novaleolin/evalfloor/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalfloor*"]
